[package]
name = "qingmo"
version = "0.1.5"
description = "Qingmo — local-first Markdown editor"
authors = ["Qingmo Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "qingmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test-only embedded WebDriver server + execute/mocking plugin. Never
# enabled in release builds; see scripts/ci/test-tauri.sh.
e2e-webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
atomic-write-file = "0.3.1"
base64 = "0.22"
blake3 = "1.8.7"
encoding_rs = "0.8.42"
file-id = "0.2.3"
notify-debouncer-full = "0.7"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "parking_lot"] }
tracing-appender = "0.2"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3"
wiremock = "0.6"
