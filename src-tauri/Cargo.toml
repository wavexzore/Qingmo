[package]
name = "qingmo"
version = "0.1.0"
description = "Qingmo — local-first Markdown editor"
authors = ["Qingmo Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "qingmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
atomic-write-file = "0.3.1"
blake3 = "1.8.7"
encoding_rs = "0.8.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "=2.14.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3"
