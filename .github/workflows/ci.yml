name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  web:
    name: Ubuntu / web + E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Version single source
        run: node scripts/release/check-versions.mjs

      - name: Release notes for current version
        run: node scripts/release/check-release-notes.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (unit + e2e)
        run: pnpm typecheck:e2e && pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Dependency boundary
        run: pnpm depcruise

      - name: Format check
        run: pnpm format:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ubuntu
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: Ubuntu / contract + generated + negative probes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust clippy (Linux)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Contract + security config
        run: cargo test --manifest-path src-tauri/Cargo.toml --test commands_contract --test security_config

      - name: Generated bindings are current
        run: bash scripts/ci/check-generated.sh

      - name: Negative contract probe
        run: bash scripts/ci/negative-contract.sh

      - name: Negative capability probe
        run: bash scripts/ci/negative-capability.sh

  macos:
    name: macOS / fmt + clippy + test + debug build
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Install minisign
        run: brew install minisign

      - name: Release gate fixtures
        run: pnpm release:test

      - name: Tauri debug build (no bundle)
        # Bundling signs updater artifacts; without the release key the .sig is
        # missing. The release workflow owns bundling/signing; CI only compiles.
        run: pnpm tauri build --debug --no-bundle

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            test-results/
            playwright-report/
            bench/results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows / cargo check
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo check (compile-only)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
