name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  web:
    name: Ubuntu / web + E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Version single source
        run: node scripts/release/check-versions.mjs

      - name: Release notes for current version
        run: node scripts/release/check-release-notes.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (unit + e2e)
        run: pnpm typecheck:e2e && pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Dependency boundary
        run: pnpm depcruise

      - name: Format check
        run: pnpm format:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ubuntu
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: Ubuntu / contract + generated + negative probes + all targets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            cmake \
            libclang-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache meeting test fixtures
        uses: actions/cache@v4
        with:
          path: src-tauri/target/meeting-fixtures
          key: meeting-fixtures-v1

      - name: Fetch meeting test fixtures
        run: bash scripts/dev/fetch-meeting-fixtures.sh

      - name: Rust clippy (Linux)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Contract + security config
        run: cargo test --manifest-path src-tauri/Cargo.toml --test commands_contract --test security_config

      - name: Rust tests (Linux, all targets)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Generated bindings are current
        run: bash scripts/ci/check-generated.sh

      - name: Negative contract probe
        run: bash scripts/ci/negative-contract.sh

      - name: Negative capability probe
        run: bash scripts/ci/negative-capability.sh

  macos:
    name: macOS / fmt + clippy + test + debug build + native E2E
    runs-on: macos-14
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install llama build tools
        run: brew install cmake llvm ffmpeg

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cache meeting test fixtures
        uses: actions/cache@v4
        with:
          path: src-tauri/target/meeting-fixtures
          key: meeting-fixtures-v1

      - name: Fetch meeting test fixtures
        run: bash scripts/dev/fetch-meeting-fixtures.sh

      - name: Vendor patch guard
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          if [ -d src-tauri/vendor/sherpa-onnx ]; then
            bash scripts/ci/check-vendor.sh --require
          else
            bash scripts/ci/check-vendor.sh
          fi

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Install minisign
        run: brew install minisign

      - name: Release gate fixtures
        run: pnpm release:test

      - name: Tauri debug build (no bundle)
        # Bundling signs updater artifacts; without the release key the .sig is
        # missing. The release workflow owns bundling/signing; CI only compiles.
        run: pnpm tauri build --debug --no-bundle

      - name: Meeting E2E fixtures
        run: |
          if [ -f scripts/dev/gen-meeting-fixtures.sh ]; then
            bash scripts/dev/gen-meeting-fixtures.sh
          else
            echo "meeting fixture generator not present yet"
          fi

      - name: Cache meeting E2E models
        if: ${{ hashFiles('scripts/meeting-models/ci-fetch.sh') != '' }}
        uses: actions/cache@v4
        env:
          MEETING_E2E_MODELS: ${{ runner.temp }}/meeting-models
        with:
          path: ${{ env.MEETING_E2E_MODELS }}
          key: meeting-e2e-models-v1-${{ hashFiles('src-tauri/src/services/meeting/models.rs') }}

      - name: Fetch meeting E2E models
        env:
          MEETING_E2E_MODELS: ${{ runner.temp }}/meeting-models
        run: |
          if [ -f scripts/meeting-models/ci-fetch.sh ]; then
            bash scripts/meeting-models/ci-fetch.sh "$MEETING_E2E_MODELS"
          else
            echo "meeting model fetcher not present yet"
          fi

      - name: Native E2E (includes meeting specs)
        env:
          MEETING_E2E_MODELS: ${{ runner.temp }}/meeting-models
        run: pnpm ci:tauri

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: |
            test-results/
            playwright-report/
            bench/results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows / cargo test (targeted)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install llama build tools
        run: choco install cmake llvm -y --no-progress

      - name: Cargo check (all targets)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests (Windows, targeted)
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --lib
          --test file_identity
          --test document_identity
          --test document_roundtrip
          --test document_save_as
          --test document_token
          --test history_store
          --test session_store
          --test trash_store
          --test workspace
          --test workspace_watcher
          --test search_index
          --test security_config
          --test commands_contract
