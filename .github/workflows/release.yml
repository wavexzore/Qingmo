name: Release

# Push a vX.Y.Z tag to build and publish every platform:
#   prepare -> draft release -> macOS/Windows/Linux builds -> latest.json
#   -> independent re-verification -> publish the draft.
# Run "workflow_dispatch" with an existing tag to retry a failed release.
#
# Required secrets (repository or `release` environment):
#   TAURI_SIGNING_PRIVATE_KEY           updater minisign private key (file content)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  key password (must not be empty)
# Optional macOS signing/notarization secrets (unsigned builds otherwise):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Validate tag, versions and release notes
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag must look like vX.Y.Z, got: $tag"
              exit 1
              ;;
          esac
          node scripts/release/check-versions.mjs --expect "$tag"
          node scripts/release/check-release-notes.mjs --version "$tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Check release secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured; updater artifacts cannot be signed"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"
            exit 1
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is empty"
            exit 1
          fi
          if [ -n "$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ] && { [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            echo "::error::set all of APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID, or none of them"
            exit 1
          fi
          if [ -n "$APPLE_ID" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::Apple notarization requires APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD"
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not configured; the macOS build will be unsigned"
          fi

      - name: Render bilingual release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/release/check-release-notes.mjs --version "$VERSION" --lang all \
            --out "$RUNNER_TEMP/RELEASE-NOTES.txt"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $TAG is already published; bump the version instead"
              exit 1
            fi
            gh release edit "$TAG" --title "青墨 $TAG" --notes-file "$RUNNER_TEMP/RELEASE-NOTES.txt"
            echo "reusing existing draft release $TAG"
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "青墨 $TAG" --notes-file "$RUNNER_TEMP/RELEASE-NOTES.txt"
            echo "created draft release $TAG"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact_paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact_paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
        with:
          toolchain: 1.91.1

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            wget \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # An unset GitHub secret still becomes an empty environment variable, and
      # Tauri treats a present-but-empty APPLE_CERTIFICATE as an import request.
      # Export only the Apple values that are actually configured.
      - name: Export configured Apple signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              delimiter="QINGMO_EOF_$(openssl rand -hex 12)"
              {
                printf '%s<<%s\n' "$name" "$delimiter"
                printf '%s\n' "$value"
                printf '%s\n' "$delimiter"
              } >>"$GITHUB_ENV"
            fi
          done

      - name: Build, sign and notarize bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Tauri notarizes and staples the .app, not the .dmg. The DMG feeds the
      # download path, so it needs its own ticket as well.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ]; then
            echo "skipping DMG notarization: APPLE_ID is not configured"
            exit 0
          fi
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          if ! xcrun stapler validate "$dmg" >/dev/null 2>&1; then
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          fi
          xcrun stapler validate "$dmg"

      - name: Verify the macOS signature and notarization ticket
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "skipping macOS signature verification: the build is unsigned"
            exit 0
          fi
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ -n "${APPLE_ID:-}" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
            dmg="$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
            test -n "$dmg"
            xcrun stapler validate "$dmg"
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 3

  manifest:
    name: Assemble and verify latest.json
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Render per-language release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/release/check-release-notes.mjs --version "$VERSION" --lang zh-CN \
            --out dist/RELEASE-NOTES.zh.txt
          node scripts/release/check-release-notes.mjs --version "$VERSION" --lang en-US \
            --out dist/RELEASE-NOTES.en.txt

      - name: Generate latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/make-latest-json.mjs \
            --version "$VERSION" \
            --artifacts dist \
            --out dist/latest.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --notes-zh-file dist/RELEASE-NOTES.zh.txt \
            --notes-en-file dist/RELEASE-NOTES.en.txt

      - name: Verify manifest, platform keys and signatures
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          node scripts/release/check-latest-json.mjs \
            --latest-json dist/latest.json \
            --tag "$TAG" \
            --pubkey "$pubkey" \
            --artifacts dist \
            --require darwin-aarch64,darwin-x86_64,windows-x86_64,linux-x86_64

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 ./* >SHA256SUMS.txt)
          gh release upload "$TAG" dist/* --clobber

  publish:
    name: Publish verified release
    needs: [prepare, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download the uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --dir verify

      - name: Re-verify the downloaded manifest and signatures
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          node scripts/release/check-latest-json.mjs \
            --latest-json verify/latest.json \
            --tag "$TAG" \
            --pubkey "$pubkey" \
            --artifacts verify \
            --require darwin-aarch64,darwin-x86_64,windows-x86_64,linux-x86_64

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Confirm the published state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,isDraft,isLatest \
            --jq '"published \(.tagName): latest=\(.isLatest) draft=\(.isDraft)"'
